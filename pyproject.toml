[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metricspec"
version = "0.1.0"
description = "Unit tests for business metrics. Contract testing for analytical meaning."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "MetricSpec contributors" }]
keywords = ["metrics", "semantic-layer", "data-quality", "duckdb", "analytics"]
dependencies = [
  "duckdb>=1.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=5.0",
]

[project.scripts]
metricspec = "metricspec.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["metricspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
